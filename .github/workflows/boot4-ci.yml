name: Boot 4 CI

on:
  push:
    branches: [boot4]
    tags: ['v*-boot4']
  pull_request:
    branches: [boot4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify Spring Boot 4.1.3
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Include dependency POM
        run: cp pom.xml target/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: boot4-java-${{ matrix.java }}
          path: |
            target/*.jar
            target/pom.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java }}
          path: target/surefire-reports/
